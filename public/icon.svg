<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1c24" />
      <stop offset="100%" stop-color="#0d0e12" />
    </linearGradient>

    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a0acbc" />
      <stop offset="50%" stop-color="#5b6675" />
      <stop offset="100%" stop-color="#2d323b" />
    </linearGradient>

    <linearGradient id="blueNeon" x1="0%" y1="0%" x2="100%" y2="100%">
